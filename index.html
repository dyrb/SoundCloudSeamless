<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Generate seamless SoundCloud banners and avatars from a single image.">
<title>SoundCloud Seamless Generator</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: #141414; color: #eee; font: 14px system-ui, sans-serif; }
  main { max-width: 1100px; margin: auto; }
  h1 { margin: 0 0 24px; font-size: 24px; font-weight: 600; }
  button, select, input { font: inherit; }
  button, select { height: 44px; padding: 0 16px; border: 1px solid #444; border-radius: 6px; background: #252525; color: #eee; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #333; }
  :disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid #f76b32; outline-offset: 3px; }
  [hidden] { display: none !important; }
  #upload { width: 100%; height: 120px; border: 2px dashed #444; background: #1b1b1b; }
  #upload.compact { height: 44px; }
  #preview { position: relative; margin-top: 20px; background: #252525; }
  canvas { display: block; width: 100%; height: auto; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #outline { position: absolute; left: calc(54 / 2480 * 100%); top: calc(46 / 520 * 100%); width: calc(408 / 2480 * 100%); aspect-ratio: 1; border: 2px solid #fff; border-radius: 50%; pointer-events: none; }
  fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
  .zoom { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
  #zoom { width: 100%; accent-color: #f76b32; }
  #zoomValue { min-width: 42px; color: #aaa; font-variant-numeric: tabular-nums; }
  .downloads button { flex: 1; }
  #error { color: #ff9b85; }
  #error:empty { display: none; }
  footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #333; text-align: right; }
  footer a { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 6px; background: #f76b32; color: #141414; font-weight: 600; text-decoration: none; }
  footer a:hover { background: #ff824b; }
  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .zoom { flex-basis: 100%; }
    .downloads { gap: 8px; }
    .downloads button, .downloads select { padding: 0 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<main>
  <h1>SoundCloud Seamless Generator</h1>

  <div id="dropZone">
    <button id="upload" type="button">Choose or drop an image</button>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>

    <div id="editor" hidden>
      <div id="preview">
        <canvas id="canvas" width="2480" height="520" tabindex="0" aria-label="Move the image with your mouse, touch, or arrow keys"></canvas>
        <div id="outline" aria-hidden="true"></div>
      </div>

      <fieldset id="controls" disabled aria-label="Image controls">
        <div class="controls">
          <label class="zoom">
            Zoom
            <input id="zoom" type="range" min="1" max="4" step="0.01" value="1">
            <output id="zoomValue" for="zoom">100%</output>
          </label>
          <button id="reset" type="button">Reset</button>
        </div>

        <div class="controls downloads">
          <button id="banner" type="button">Download banner</button>
          <button id="avatar" type="button">Download avatar</button>
          <select id="format" aria-label="Export format">
            <option value="png">PNG</option>
            <option value="jpeg">JPG</option>
          </select>
        </div>
      </fieldset>
    </div>
  </div>

  <p id="error" role="alert"></p>

  <footer>
    <a href="https://soundcloud.com/jwm" target="_blank" rel="noopener noreferrer">My SoundCloud</a>
  </footer>
</main>

<script>
'use strict';

const W = 2480, H = 520, SIZE = 408, AX = 54, AY = 46;
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const clamp = (n, min, max) => Math.max(min, Math.min(n, max));
let image, scale = 1, zoom = 1, x = 0, y = 0, drag, loadId = 0;

function draw() {
  const w = image.naturalWidth * scale, h = image.naturalHeight * scale;
  x = clamp(x, Math.min(0, W - w), 0);
  y = clamp(y, Math.min(0, H - h), 0);
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(image, x, y, w, h);
  $('zoom').value = zoom;
  $('zoomValue').value = Math.round(zoom * 100) + '%';
}

function reset() {
  zoom = 1;
  scale = Math.max(W / image.naturalWidth, H / image.naturalHeight);
  x = (W - image.naturalWidth * scale) / 2;
  y = (H - image.naturalHeight * scale) / 2;
  draw();
}

async function load(file) {
  if (!file) return;
  const id = ++loadId;
  stopDrag();
  $('error').textContent = '';

  if (!(/^image\/(png|jpeg)$/i.test(file.type) || (!file.type && /\.(png|jpe?g)$/i.test(file.name)))) {
    $('controls').disabled = !image;
    $('error').textContent = 'Please choose a JPG or PNG image.';
    return;
  }

  $('controls').disabled = true;
  const url = URL.createObjectURL(file);

  try {
    const next = new Image();
    next.src = url;
    await next.decode();
    if (id !== loadId) return;
    image = next;
    reset();
    $('editor').hidden = false;
    $('upload').classList.add('compact');
    $('upload').textContent = 'Replace image';
  } catch {
    if (id === loadId) $('error').textContent = 'Unable to open this image.';
  } finally {
    URL.revokeObjectURL(url);
    if (id === loadId) $('controls').disabled = !image;
  }
}

$('upload').onclick = () => $('fileInput').click();
$('fileInput').onchange = event => {
  const file = event.target.files[0];
  event.target.value = '';
  load(file);
};

for (const type of ['dragover', 'drop']) {
  window.addEventListener(type, event => event.preventDefault());
}
$('dropZone').ondrop = event => load(event.dataTransfer.files[0]);

$('zoom').oninput = event => {
  const next = Number(event.target.value), ratio = next / zoom;
  x = W / 2 - (W / 2 - x) * ratio;
  y = H / 2 - (H / 2 - y) * ratio;
  scale *= ratio;
  zoom = next;
  draw();
};
$('reset').onclick = reset;

canvas.onpointerdown = event => {
  if (!image || $('controls').disabled || !event.isPrimary || event.button !== 0) return;
  canvas.focus({ preventScroll: true });
  canvas.setPointerCapture(event.pointerId);
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
};

canvas.onpointermove = event => {
  if (!drag || drag.id !== event.pointerId) return;
  const rect = canvas.getBoundingClientRect();
  x += (event.clientX - drag.x) * W / rect.width;
  y += (event.clientY - drag.y) * H / rect.height;
  drag.x = event.clientX;
  drag.y = event.clientY;
  draw();
};

function stopDrag(event) {
  if (!drag || (event && event.pointerId !== drag.id)) return;
  const id = drag.id;
  drag = null;
  if (canvas.hasPointerCapture(id)) canvas.releasePointerCapture(id);
}

canvas.onpointerup = canvas.onpointercancel = canvas.onlostpointercapture = stopDrag;

canvas.onkeydown = event => {
  if (!image || $('controls').disabled) return;
  const step = event.shiftKey ? 1 : 20;
  const move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key];
  if (!move) return;
  event.preventDefault();
  x += move[0];
  y += move[1];
  draw();
};

async function save(avatar) {
  if (!image || $('controls').disabled) return;
  $('error').textContent = '';

  try {
    const jpg = $('format').value === 'jpeg';
    const output = document.createElement('canvas');
    output.width = avatar ? SIZE : W;
    output.height = avatar ? SIZE : H;
    const context = output.getContext('2d');

    if (jpg) {
      context.fillStyle = '#fff';
      context.fillRect(0, 0, output.width, output.height);
    }
    if (avatar) context.drawImage(canvas, AX, AY, SIZE, SIZE, 0, 0, SIZE, SIZE);
    else context.drawImage(canvas, 0, 0);

    const blob = await new Promise(resolve => output.toBlob(resolve, jpg ? 'image/jpeg' : 'image/png', .95));
    if (!blob) throw new Error();

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `soundcloud_${avatar ? 'avatar' : 'banner'}.${jpg ? 'jpg' : 'png'}`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch {
    $('error').textContent = 'Unable to save the image. Please try again.';
  }
}

$('banner').onclick = () => save(false);
$('avatar').onclick = () => save(true);
</script>
</body>
</html>
